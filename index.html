<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex,nofollow">
    <title>NOC 值班班表</title>
    <script>
        (function () {
            let theme = null;
            try { theme = localStorage.getItem('noc-static-theme'); } catch (_) { }
            if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#212624' : '#ffffff';
        })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./schedule-core.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
    <header class="masthead">
        <div class="header-bar">
            <div class="brand"><span>NOC</span></div>
            <label class="theme-switch" for="darkTheme"><span>深色</span><input id="darkTheme" type="checkbox" role="switch" aria-label="深色版型"></label>
        </div>
        <div class="heading"><h1>值班班表</h1></div>
        <p id="coverage" class="metadata">資料載入中</p>
    </header>
    <main>
        <p id="fatal" class="notice error" role="alert" hidden></p>
        <p id="sourceWarnings" class="notice" role="status" popover="manual" tabindex="0" hidden></p>
        <nav class="tabs" aria-label="班表檢視">
            <button type="button" data-tab="personal" aria-current="page">個人班表</button>
            <button type="button" data-tab="current">當前班表</button>
            <button type="button" data-tab="daily">當日班表</button>
        </nav>
        <section id="personal" aria-label="個人班表">
            <form id="employeeForm" class="employee-form">
                <label for="empId">工號</label>
                <div class="input-row"><input id="empId" name="empId" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="輸入工號" required><button type="submit" class="primary">查詢</button></div>
                <p id="employeeError" class="field-error" role="alert" hidden></p>
            </form>
            <div id="personalSchedule" hidden>
                <div class="person-heading"><h2 id="employeeName"></h2><button id="clearEmployee" type="button" class="plain">清除工號</button></div>
