<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex,nofollow">
    <title>NOC 值班班表</title>
    <script>
        (function () {
            let theme = null;
            try { theme = localStorage.getItem('noc-static-theme'); } catch (_) { }
            const urlTheme = new URLSearchParams(location.search).get('theme');
            if (urlTheme === 'dark' || urlTheme === 'light') theme = urlTheme;
            if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#212624' : '#ffffff';
        })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./schedule-core.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
    <header class="masthead">
        <div class="header-bar">
            <div class="brand"><img src="./assets/icon.svg" width="32" height="32" alt=""><h1>值班班表</h1><p id="dataStatus" class="status" role="status" hidden></p></div>
            <label class="theme-switch" for="darkTheme"><span aria-hidden="true">&#9790;</span><input id="darkTheme" type="checkbox" role="switch" aria-label="深色版型"></label>
        </div>
    </header>
    <main>
        <p id="fatal" class="notice error" role="alert" hidden></p>
        <p id="sourceWarnings" class="notice" role="status" popover="manual" tabindex="0" hidden></p>
        <nav class="tabs" aria-label="班表檢視">
            <button type="button" data-tab="personal" aria-current="page">個人班表</button>
            <button type="button" data-tab="current">當前班表</button>
            <button type="button" data-tab="daily">當日班表</button>
        </nav>
        <section id="personal" aria-label="個人班表">
            <form id="employeeForm" class="employee-form">
                <label for="empId">工號</label>
                <div class="input-row"><input id="empId" name="empId" type="text" list="empList" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="輸入工號" required><button type="submit" class="primary">查詢</button></div>
                <p id="employeeError" class="field-error" role="alert" hidden></p>
            </form>
            <div id="personalSchedule" hidden>
                <div class="person-heading">
                    <h2 id="employeeName"></h2>
                    <section id="dayDetail" class="day-detail" aria-label="日期班別明細"><h3 id="selectedDate"></h3><div id="selectedShift"></div></section>
                    <div class="person-actions"><button id="exportIcs" type="button" class="plain">匯出 ICS</button><button id="clearEmployee" type="button" class="plain">清除工號</button></div>
                </div>
                <section id="colleagues" class="colleagues" aria-label="同班同事" hidden><h3 id="colleaguesTitle"></h3><div id="colleaguesList" class="chips"></div></section>
                <div class="month-nav"><button id="previousMonth" type="button" class="icon-button" aria-label="上個月" title="上個月">&larr;</button><div class="nav-title"><div class="month-title-row"><button id="monthLabel" type="button" class="month-label"></button><button id="goCurrent" type="button" class="today-button" aria-label="回到本月">今</button></div></div><button id="nextMonth" type="button" class="icon-button" aria-label="下個月" title="下個月">&rarr;</button><div class="view-toggle" role="group" aria-label="檢視方式"><button type="button" data-view="month" aria-pressed="true">月</button><button type="button" data-view="week" aria-pressed="false">週</button></div></div>
                <div id="weekdays" class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                <div id="calendar" class="calendar" aria-label="個人月曆"></div>
                <div id="weekList" class="week-list" role="group" aria-label="個人週班表" hidden></div>
                <div class="person-stats"><div id="statCounts" class="stat-counts"></div></div>
            </div>
        </section>
        <section id="current" aria-label="當前班表" hidden>
            <div class="section-heading"><h2>當前班表</h2><span id="liveDot" class="live-dot" aria-hidden="true"></span></div>
            <p id="currentTime" class="metadata"></p>
            <p id="currentNotice" class="notice" hidden></p>
            <div id="currentSummary" class="summary"></div>
            <div id="currentRoster" class="roster"></div>
            <details id="unknownTimes" class="unknown-times" hidden><summary>時間未定義的排班</summary><div id="unknownRoster"></div></details>
        </section>
        <section id="daily" aria-label="當日班表" hidden>
            <div class="section-heading"><h2>當日班表</h2><button id="goToday" type="button" class="plain">今天</button></div>
            <div class="date-row"><label for="rosterDate">日期</label><button id="prevDay" type="button" class="icon-button" aria-label="前一天" title="前一天">&larr;</button><input id="rosterDate" type="date"><button id="nextDay" type="button" class="icon-button" aria-label="後一天" title="後一天">&rarr;</button></div>
            <p id="dailyDateLabel" class="metadata"></p>
            <p id="dailyNotice" class="notice" hidden></p>
            <div id="dailySummary" class="summary"></div>
            <div id="shiftFilter" class="filter-bar" role="group" aria-label="班別篩選"></div>
            <div id="dailyRoster" class="roster"></div>
        </section>
    </main>
    <datalist id="empList"></datalist>
    <dialog id="empDialog" aria-labelledby="empDialogTitle">
        <form id="empDialogForm" method="dialog" novalidate>
            <h2 id="empDialogTitle">請輸入員工編號</h2>
            <p class="metadata">輸入後會記住在這個瀏覽器，下次不需再輸入。</p>
            <input id="empDialogId" type="text" list="empList" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="員工編號" aria-label="員工編號" autofocus>
            <p id="empDialogError" class="field-error" role="alert" hidden>此工號不在本次班表資料中，請確認工號。</p>
            <div class="dialog-actions"><button id="empDialogSkip" type="button" class="plain">稍後再說</button><button type="submit" class="primary">確定</button></div>
        </form>
    </dialog>
    <noscript><p class="notice error">請啟用 JavaScript 以查看班表。</p></noscript>
</body>
</html>
