<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex,nofollow">
    <title>NOC 值班班表</title>
    <script>
        (function () {
            let theme = null;
            try { theme = localStorage.getItem('noc-static-theme'); } catch (_) { }
            if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#212624' : '#ffffff';
        })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./schedule-core.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
    <header class="masthead">
        <div class="header-bar">
            <div class="brand"><img src="./assets/icon.svg" width="40" height="40" alt=""><span>NOC</span></div>
            <label class="theme-switch" for="darkTheme"><span>深色</span><input id="darkTheme" type="checkbox" role="switch" aria-label="深色版型"></label>
        </div>
        <div class="heading"><h1>值班班表</h1></div>
        <p id="coverage" class="metadata">資料載入中</p>
    </header>
    <main>
        <p id="fatal" class="notice error" role="alert" hidden></p>
        <p id="sourceWarnings" class="notice" role="status" popover="manual" tabindex="0" hidden></p>
        <nav class="tabs" aria-label="班表檢視">
            <button type="button" data-tab="personal" aria-current="page">個人班表</button>
            <button type="button" data-tab="current">當前班表</button>
            <button type="button" data-tab="daily">當日班表</button>
        </nav>
        <section id="personal" aria-label="個人班表">
            <form id="employeeForm" class="employee-form">
                <label for="empId">工號</label>
                <div class="input-row"><input id="empId" name="empId" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="輸入工號" required><button type="submit" class="primary">查詢</button></div>
                <p id="employeeError" class="field-error" role="alert" hidden></p>
            </form>
            <div id="personalSchedule" hidden>
                <div class="person-heading"><h2 id="employeeName"></h2><button id="clearEmployee" type="button" class="plain">清除工號</button></div>
                <div class="month-nav"><button id="previousMonth" type="button" class="icon-button" aria-label="上個月" title="上個月">&larr;</button><h3 id="monthLabel"></h3><button id="nextMonth" type="button" class="icon-button" aria-label="下個月" title="下個月">&rarr;</button></div>
                <div id="monthSummary" class="summary"></div>
                <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                <div id="calendar" class="calendar" aria-label="個人月曆"></div>
                <div class="legend"><span><i class="work-dot"></i>出勤</span><span><i class="rest-dot"></i>休假</span><span><i class="today-dot"></i>今日</span></div>
                <section class="day-detail" aria-label="日期班別明細"><h3 id="selectedDate"></h3><div id="selectedShift"></div></section>
            </div>
        </section>
        <section id="current" aria-label="當前班表" hidden>
            <div class="section-heading"><h2>目前值班</h2><span class="live-dot" aria-hidden="true"></span></div>
            <p id="currentTime" class="metadata"></p>
            <p id="currentNotice" class="notice" hidden></p>
            <div id="currentSummary" class="summary"></div>
            <div id="currentRoster" class="roster"></div>
            <details id="unknownTimes" class="unknown-times" hidden><summary>時間未定義的排班</summary><div id="unknownRoster"></div></details>
        </section>
        <section id="daily" aria-label="當日班表" hidden>
            <div class="section-heading"><h2>當日班表</h2><button id="goToday" type="button" class="plain">今天</button></div>
            <div class="date-row"><label for="rosterDate">日期</label><input id="rosterDate" type="date"></div>
            <p id="dailyNotice" class="notice" hidden></p>
            <div id="dailySummary" class="summary"></div>
            <div class="roster-controls"><label for="shiftFilter">班別</label><select id="shiftFilter"><option value="">全部班別</option></select><label class="checkbox-label"><input id="includeRest" type="checkbox">含休假</label></div>
            <div id="dailyRoster" class="roster"></div>
        </section>
    </main>
    <footer><p id="updatedAt"></p><p>Asia/Taipei · 以發布班表為準</p></footer>
    <noscript><p class="notice error">請啟用 JavaScript 以查看班表。</p></noscript>
</body>
</html>
