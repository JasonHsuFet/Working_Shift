<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex,nofollow">
    <title>NOC 值班班表</title>
    <script src="./js/theme.js"></script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="icon-system" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
        <symbol id="icon-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
        <symbol id="icon-dark" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
        <symbol id="icon-all" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
        <symbol id="icon-now" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
        <symbol id="icon-morning" viewBox="0 0 24 24"><path d="M12 2v8M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/></symbol>
        <symbol id="icon-afternoon" viewBox="0 0 24 24"><path d="M12 10V2M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M16 6l-4 4-4-4M16 18a4 4 0 0 0-8 0"/></symbol>
        <symbol id="icon-night" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
        <symbol id="icon-n" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
        <symbol id="icon-rest" viewBox="0 0 24 24"><path d="M10 2v2M14 2v2M6 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/></symbol>
    </svg>
    <header class="masthead">
        <div class="header-bar">
            <div class="brand"><img src="./assets/icon.svg" width="32" height="32" alt=""><h1>值班班表</h1><p id="dataStatus" class="status" role="status" hidden></p></div>
            <button id="themeToggle" type="button" class="theme-toggle" aria-label="主題：跟隨系統" title="主題：跟隨系統"><svg data-theme-icon="system" class="icon" aria-hidden="true"><use href="#icon-system"/></svg><svg data-theme-icon="light" hidden class="icon" aria-hidden="true"><use href="#icon-light"/></svg><svg data-theme-icon="dark" hidden class="icon" aria-hidden="true"><use href="#icon-dark"/></svg></button>
        </div>
    </header>
    <main>
        <p id="fatal" class="notice error" role="alert" hidden></p>
        <p id="sourceWarnings" class="notice" role="status" popover="manual" tabindex="0" hidden></p>
        <nav class="tabs" aria-label="班表檢視">
            <a href="#/personal" data-tab="personal" aria-current="page">個人班表</a>
            <a href="#/on-duty" data-tab="on-duty">當日班表</a>
        </nav>
        <section id="personal" aria-label="個人班表">
            <form id="employeeForm" class="employee-form">
                <label for="empId">工號</label>
                <div class="input-row"><input id="empId" name="empId" type="text" list="empList" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="輸入工號" required><button type="submit" class="primary">查詢</button></div>
                <p id="employeeError" class="field-error" role="alert" hidden></p>
            </form>
            <div id="personalSchedule" hidden>
                <div class="person-card">
                    <div class="person-heading">
                        <div class="info-row"><span class="info-label">姓名</span><h2 id="employeeName"></h2></div>
                        <div class="person-actions"><button id="exportIcs" type="button" class="plain">匯出 ICS</button><button id="clearEmployee" type="button" class="plain">清除工號</button></div>
                    </div>
                    <section id="dayDetail" class="day-detail" aria-label="日期班別明細">
                        <div class="info-row"><span class="info-label">日期</span><h3 id="selectedDate"></h3></div>
                        <div class="info-row"><span class="info-label">班別</span><div id="selectedShift"></div></div>
                    </section>
                    <section id="colleagues" class="colleagues" aria-label="同班同事" hidden><h3 id="colleaguesTitle"></h3><div id="colleaguesList" class="chips"></div></section>
                </div>
                <div class="month-nav"><button id="prevPeriod" type="button" class="icon-button" aria-label="上個月" title="上個月"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"/></svg></button><div class="nav-title"><div class="month-title-row"><button id="periodLabel" type="button" class="period-label"></button><button id="goCurrent" type="button" class="today-button" aria-label="回到本月">今</button></div></div><button id="nextPeriod" type="button" class="icon-button" aria-label="下個月" title="下個月"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button><div class="view-toggle" role="group" aria-label="檢視方式"><button type="button" data-view="month" aria-pressed="true">月</button><button type="button" data-view="week" aria-pressed="false">週</button></div></div>
                <div id="weekdays" class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                <div id="calendar" class="calendar" aria-label="個人月曆"></div>
                <div id="weekList" class="week-list" role="group" aria-label="個人週班表" hidden></div>
                <div class="person-stats"><div id="statCounts" class="stat-counts"></div><p id="statStreak" class="stat-line"></p></div>
            </div>
        </section>
        <section id="on-duty" aria-label="當日班表" hidden>
            <div class="date-row"><label for="onDutyDate">日期</label><button id="prevDay" type="button" class="icon-button" aria-label="前一天" title="前一天"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"/></svg></button><input id="onDutyDate" type="date"><button id="nextDay" type="button" class="icon-button" aria-label="後一天" title="後一天"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button><button id="goToday" type="button" class="plain">今天</button></div>
            <div class="live-row metadata"><span id="liveDot" class="live-dot" aria-hidden="true"></span><span id="onDutyDateLabel"></span></div>
            <p id="onDutyNotice" class="notice" hidden></p>
            <div id="onDutySummary" class="summary"></div>
            <div id="shiftFilter" class="filter-bar" role="group" aria-label="班別篩選"></div>
            <div id="onDutyRoster" class="roster"></div>
            <details id="unknownTimes" class="unknown-times" hidden><summary>時間未定義的排班</summary><div id="unknownRoster"></div></details>
        </section>
    </main>
    <datalist id="empList"></datalist>
    <dialog id="empDialog" aria-labelledby="empDialogTitle">
        <form id="empDialogForm" method="dialog" novalidate>
            <h2 id="empDialogTitle">請輸入員工編號</h2>
            <p class="metadata">輸入後會記住在這個瀏覽器，下次不需再輸入。</p>
            <input id="empDialogId" type="text" list="empList" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="員工編號" aria-label="員工編號" autofocus>
            <p id="empDialogError" class="field-error" role="alert" hidden>此工號不在本次班表資料中，請確認工號。</p>
            <div class="dialog-actions"><button id="empDialogSkip" type="button" class="plain">稍後再說</button><button type="submit" class="primary">確定</button></div>
        </form>
    </dialog>
    <noscript><p class="notice error">請啟用 JavaScript 以查看班表。</p></noscript>
</body>
</html>
